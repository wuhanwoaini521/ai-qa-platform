    <!--
      No external font CDN on purpose: the platform must render correctly in air-gapped and
      CSP-restricted deployments, and a blocked webfont also blocks document.fonts.ready, which
      hangs Playwright screenshot capture. Typography comes from --font-sans/--font-mono
      (local and system stacks). To ship a licensed font, self-host it under public/fonts and
      declare it with @font-face in src/index.css.
    -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
