[project]
name = "worker"
version = "0.1.0"
description = "Background QA Task and Test Execution Worker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "httpx>=0.28.0",
    "playwright>=1.50.0",
    "qa-core",
    "platform-config",
    "pytest>=8.0",
]

[tool.uv.sources]
qa-core = { workspace = true }
platform-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
