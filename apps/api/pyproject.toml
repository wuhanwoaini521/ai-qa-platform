[project]
name = "api"
version = "0.1.0"
description = "AI QA Platform Backend API Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.12",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
    "playwright==1.62.0",
    "debugpy>=1.8.17,<2",
    "cryptography>=43.0.0",
    "pytest>=8.3.0",
    "pytest-xdist>=3.6.0,<4",
    "project-model",
    "qa-core",
    "integrations",
    "platform-config",
    "basedpyright>=1.31,<2",
    "alembic>=1.14,<2",
]

[tool.uv.sources]
project-model = { workspace = true }
qa-core = { workspace = true }
integrations = { workspace = true }
platform-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
