<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northstar · Demo Shop</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #18243b; background: #f4f6fa; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { background: #fff; border-bottom: 1px solid #dde3ef; padding: 22px 6%; display: flex; align-items: center; gap: 24px; }
      header a { font-weight: 750; font-size: 22px; letter-spacing: -.7px; color: #18243b; text-decoration: none; }
      header small { color: #63718b; }
      header button { margin-left: auto; }
      main { max-width: 1080px; margin: 40px auto; padding: 0 24px; }
      h1 { font-size: 36px; letter-spacing: -1px; margin-bottom: 12px; }
      p { color: #53647d; line-height: 1.6; }
      .eyebrow { color: #4562cf; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
      form { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(140px, .55fr) minmax(130px, .45fr) auto; align-items: end; gap: 12px; margin: 30px 0; }
      label { display: grid; gap: 7px; color: #53647d; font-size: 13px; font-weight: 600; }
      input, select { width: 100%; min-height: 46px; font: inherit; padding: 10px 12px; border: 1px solid #cbd4e6; border-radius: 9px; background: #fff; color: #203052; }
      button { font: inherit; cursor: pointer; padding: 12px 20px; border: 1px solid #cad3e7; border-radius: 9px; background: white; color: #203052; min-height: 44px; }
      button.primary { background: #435bcc; border-color: #435bcc; color: #fff; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #eb8e2d; outline-offset: 3px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
      .card { padding: 24px; background: white; border: 1px solid #dde3ef; border-radius: 16px; }
      .photo { height: 180px; background: #e9ecf6; display: flex; align-items: center; justify-content: center; font-size: 80px; margin-bottom: 22px; border-radius: 10px; }
      .price { font-weight: 700; font-size: 24px; color: #18243b; }
      .category { color: #63718b; font-size: 13px; }
      .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
      .detail .photo { height: 340px; }
      .detail label { margin: 20px 0 8px; }
      .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px; border-bottom: 1px solid #e3e8f3; padding: 20px 0; }
      .row h2, .row p { margin: 4px 0; }
      .cart-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .cart-actions button { padding: 8px 12px; }
      .notice { background: #e8f6f0; border: 1px solid #b9dfcc; border-radius: 8px; padding: 15px; margin: 20px 0; }
      footer { margin: 50px 0; color: #63718b; font-size: 13px; }
      @media (max-width: 760px) { form { grid-template-columns: 1fr 1fr; } form .search-term { grid-column: 1 / -1; } form button { width: 100%; } }
      @media (max-width: 650px) { header small { display: none; } .detail { grid-template-columns: 1fr; } h1 { font-size: 28px; } form { grid-template-columns: 1fr; } form .search-term { grid-column: auto; } }
    </style>
  </head>
  <body>
    <header>
      <a href="#" id="home">NORTHSTAR</a>
      <small>Everyday essentials · Local QA demonstration</small>
      <button id="cart-button" type="button">Cart (<span id="cart-count">0</span>)</button>
    </header>
    <main id="content"></main>
    <script>
      let products = [];
      let cart = [];
      const content = document.getElementById('content');

      function catalog() {
        content.innerHTML = `
          <div class="eyebrow">The everyday collection</div>
          <h1>Good things. Simple choices.</h1>
          <p>Find your essential, choose a variant and make it yours.</p>
          <form id="search-form" aria-label="Filter products">
            <label class="search-term">Search products
              <input aria-label="Search products" placeholder="Search products" />
            </label>
            <label>Category
              <select id="category-filter" aria-label="Category">
                <option value="">All categories</option>
                ${[...new Set(products.map((product) => product.category))].map((category) => `<option value="${category}">${category}</option>`).join('')}
              </select>
            </label>
            <label>Maximum price
              <input id="max-price" aria-label="Maximum price" type="number" min="0" step="1" placeholder="Any price" />
            </label>
            <button class="primary" type="submit">Search</button>
          </form>
          <section class="grid" id="results" aria-label="Search results" aria-live="polite"></section>
          <footer>This local shop uses an isolated in-memory cart. Refresh to start a clean session.</footer>`;
        renderProducts(products);
        document.getElementById('search-form').onsubmit = (event) => {
          event.preventDefault();
          const term = event.currentTarget.querySelector('[aria-label="Search products"]').value.trim().toLowerCase();
          const category = document.getElementById('category-filter').value;
          const maximumPrice = document.getElementById('max-price').value;
          renderProducts(products.filter((product) =>
            product.name.toLowerCase().includes(term)
            && (!category || product.category === category)
            && (!maximumPrice || product.price <= Number(maximumPrice))
          ));
        };
      }

      function renderProducts(items) {
        const results = document.getElementById('results');
        results.innerHTML = items.length
          ? items.map((product) => `
              <article class="card">
                <div class="photo" aria-hidden="true">${product.icon}</div>
                <p class="category">${product.category}</p>
                <h2>${product.name}</h2>
                <p class="price">$${product.price}.00</p>
                <button type="button" data-product="${product.id}">View ${product.name}</button>
              </article>`).join('')
          : '<p role="status">No products found. Try another search.</p>';
        results.querySelectorAll('[data-product]').forEach((button) => {
          button.onclick = () => detail(products.find((product) => product.id === button.dataset.product));
        });
      }

      function detail(product) {
        content.innerHTML = `
          <button type="button" id="back">← Back to products</button>
          <div class="detail" style="margin-top: 24px">
            <div class="photo" aria-hidden="true">${product.icon}</div>
            <section>
              <div class="eyebrow">${product.category} · Everyday essentials</div>
              <h1>${product.name}</h1>
              <p class="price">$${product.price}.00</p>
              <p>Made for everyday use. Choose your preferred option below.</p>
              <label for="color">Color</label>
              <select id="color" aria-label="Color">${product.colors.map((color) => `<option>${color}</option>`).join('')}</select>
              <label for="size">Size</label>
              <select id="size" aria-label="Size">${product.sizes.map((size) => `<option>${size}</option>`).join('')}</select>
              <p><button id="add-to-cart" data-testid="add-to-cart" class="primary" type="button">Add to cart</button></p>
              <div id="added" role="status" aria-live="polite"></div>
            </section>
          </div>`;
        document.getElementById('back').onclick = catalog;
        document.getElementById('add-to-cart').onclick = () => {
          const color = document.getElementById('color').value;
          const size = document.getElementById('size').value;
          const item = cart.find((entry) => entry.id === product.id && entry.color === color && entry.size === size);
          if (item) item.quantity++;
          else cart.push({ ...product, color, size, quantity: 1 });
          updateCartCount();
          document.getElementById('added').innerHTML = `<p class="notice">Added to cart: ${product.name} · ${color} · ${size}</p>`;
        };
      }

      function updateCartCount() {
        document.getElementById('cart-count').textContent = cart.reduce((total, item) => total + item.quantity, 0);
      }

      function showCart() {
        const total = cart.reduce((sum, item) => sum + item.quantity * item.price, 0);
        content.innerHTML = `
          <div class="eyebrow">Your selection</div>
          <h1>Shopping cart</h1>
          <section aria-label="Cart items">
            ${cart.length ? cart.map((item, index) => `
              <article class="row" data-testid="cart-item">
                <div>
                  <h2>${item.name}</h2>
                  <p>${item.color} · ${item.size} · Quantity: ${item.quantity}</p>
                  <div class="cart-actions" aria-label="${item.name} quantity and removal">
                    <button type="button" data-cart-action="decrease" data-index="${index}" aria-label="Decrease quantity of ${item.name}">−</button>
                    <button type="button" data-cart-action="increase" data-index="${index}" aria-label="Increase quantity of ${item.name}">+</button>
                    <button type="button" data-cart-action="remove" data-index="${index}" aria-label="Remove ${item.name}">Remove</button>
                  </div>
                </div>
                <p class="price">$${item.quantity * item.price}.00</p>
              </article>`).join('') : '<p role="status">Your cart is empty.</p>'}
          </section>
          <p class="price" data-testid="cart-total">Total: $${total}.00</p>
          <button id="back" type="button">Continue shopping</button>`;
        document.getElementById('back').onclick = catalog;
        content.querySelectorAll('[data-cart-action]').forEach((button) => {
          button.onclick = () => {
            const index = Number(button.dataset.index);
            const action = button.dataset.cartAction;
            if (action === 'increase') cart[index].quantity++;
            if (action === 'decrease') cart[index].quantity--;
            if (action === 'remove' || cart[index]?.quantity <= 0) cart.splice(index, 1);
            updateCartCount();
            showCart();
          };
        });
      }

      document.getElementById('home').onclick = (event) => { event.preventDefault(); catalog(); };
      document.getElementById('cart-button').onclick = showCart;
      content.innerHTML = '<p role="status">Loading products…</p>';
      fetch('catalog.json')
        .then((response) => { if (!response.ok) throw new Error('Catalog unavailable'); return response.json(); })
        .then((data) => { products = data; catalog(); })
        .catch(() => { content.innerHTML = '<p role="alert">Products could not be loaded. Refresh to try again.</p>'; });
    </script>
  </body>
</html>
