<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Northstar · Demo Shop</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#18243b;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dde3ef;padding:22px 6%;display:flex;align-items:center;gap:24px}header a{font-weight:750;font-size:22px;letter-spacing:-.7px;color:#18243b;text-decoration:none}header small{color:#63718b}header button{margin-left:auto}main{max-width:1080px;margin:40px auto;padding:0 24px}h1{font-size:36px;letter-spacing:-1px;margin-bottom:12px}p{color:#53647d;line-height:1.6}.eyebrow{color:#4562cf;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700}form{display:flex;gap:12px;margin:30px 0}input,select{font:inherit;padding:12px;border:1px solid #cbd4e6;border-radius:9px;background:#fff}input{flex:1}button{font:inherit;cursor:pointer;padding:12px 20px;border:1px solid #cad3e7;border-radius:9px;background:white;color:#203052;min-height:44px}button.primary{background:#435bcc;border-color:#435bcc;color:#fff}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #eb8e2d;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.card{padding:24px;background:white;border:1px solid #dde3ef;border-radius:16px}.photo{height:180px;background:#e9ecf6;display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:22px;border-radius:10px}.price{font-weight:700;font-size:24px;color:#18243b}.detail{display:grid;grid-template-columns:1fr 1fr;gap:36px}.detail .photo{height:340px}.detail label{display:block;margin:20px 0 8px}.row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #e3e8f3;padding:20px 0}.notice{background:#e8f6f0;border:1px solid #b9dfcc;border-radius:8px;padding:15px;margin:20px 0}footer{margin:50px 0;color:#63718b;font-size:13px}@media(max-width:650px){header small{display:none}.detail{grid-template-columns:1fr}h1{font-size:28px}form{flex-wrap:wrap}}
</style></head><body><header><a href="#" id="home">NORTHSTAR</a><small>Everyday essentials · Local QA demonstration</small><button id="cart-button">Cart (<span id="cart-count">0</span>)</button></header><main id="content"></main>
<script>
let products=[];
let cart=[];const content=document.getElementById('content');
function catalog(){content.innerHTML='<div class="eyebrow">The everyday collection</div><h1>Good things. Simple choices.</h1><p>Find your essential, choose a variant and make it yours.</p><form id="search-form"><input aria-label="Search products" placeholder="Search products"><button class="primary">Search</button></form><section class="grid" id="results" aria-label="Search results"></section><footer>This local shop uses in-memory cart data. Refresh to start a clean session.</footer>';renderProducts(products);document.getElementById('search-form').onsubmit=e=>{e.preventDefault();const q=e.target.querySelector('input').value.trim().toLowerCase();renderProducts(products.filter(p=>p.name.toLowerCase().includes(q)))}}
function renderProducts(items){document.getElementById('results').innerHTML=items.length?items.map(p=>'<article class="card"><div class="photo" aria-hidden="true">'+p.icon+'</div><h2>'+p.name+'</h2><p class="price">$'+p.price+'.00</p><button data-product="'+p.id+'">View '+p.name+'</button></article>').join(''):'<p role="status">No products found. Try another search.</p>';document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>detail(products.find(p=>p.id===b.dataset.product)))}
function detail(p){content.innerHTML='<button id="back">← Back to products</button><div class="detail" style="margin-top:24px"><div class="photo" aria-hidden="true">'+p.icon+'</div><section><div class="eyebrow">Everyday essentials</div><h1>'+p.name+'</h1><p class="price">$'+p.price+'.00</p><p>Made for everyday use. Choose your preferred option below.</p><label for="color">Color</label><select id="color" aria-label="Color">'+p.colors.map(c=>'<option>'+c+'</option>').join('')+'</select><label for="size">Size</label><select id="size" aria-label="Size">'+p.sizes.map(s=>'<option>'+s+'</option>').join('')+'</select><p><button id="add-to-cart" data-testid="add-to-cart" class="primary">Add to cart</button></p><div id="added" role="status"></div></section></div>';document.getElementById('back').onclick=catalog;document.getElementById('add-to-cart').onclick=()=>{const color=document.getElementById('color').value,size=document.getElementById('size').value;let item=cart.find(i=>i.id===p.id&&i.color===color&&i.size===size);if(item)item.quantity++;else cart.push({...p,color,size,quantity:1});document.getElementById('cart-count').textContent=cart.reduce((n,i)=>n+i.quantity,0);document.getElementById('added').innerHTML='<p class="notice">Added to cart: '+p.name+' · '+color+' · '+size+'</p>'}}
function showCart(){content.innerHTML='<div class="eyebrow">Your selection</div><h1>Shopping cart</h1><section aria-label="Cart items">'+(cart.length?cart.map(i=>'<article class="row" data-testid="cart-item"><div><h2>'+i.name+'</h2><p>'+i.color+' · '+i.size+' · Quantity: '+i.quantity+'</p></div><p class="price">$'+(i.quantity*i.price)+'.00</p></article>').join(''):'<p role="status">Your cart is empty.</p>')+'</section><p class="price" data-testid="cart-total">Total: $'+cart.reduce((s,i)=>s+i.quantity*i.price,0)+'.00</p><button id="back">Continue shopping</button>';document.getElementById('back').onclick=catalog}
document.getElementById('home').onclick=e=>{e.preventDefault();catalog()};document.getElementById('cart-button').onclick=showCart;content.innerHTML='<p role="status">Loading products…</p>';fetch('catalog.json').then(r=>{if(!r.ok)throw new Error('Catalog unavailable');return r.json()}).then(data=>{products=data;catalog()}).catch(()=>{content.innerHTML='<p role="alert">Products could not be loaded. Refresh to try again.</p>'});
</script></body></html>
