name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The web contract is generated from the FastAPI app; a stale committed schema would make the
      # generated TypeScript types diverge from the API without any check noticing.
      - name: Check the OpenAPI contract is current
        run: uv run python scripts/export_openapi.py --check

      - name: Run backend tests
        run: uv run pytest -v

  backend-postgres:
    name: Backend Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AI_QA_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run backend tests on PostgreSQL
        run: uv run pytest apps/api -v

  windows:
    name: Windows Compatibility
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      # Runs through scripts/task.py so the Windows code path of the task runner itself is
      # covered, not just the underlying tools.
      - name: Install dependencies
        run: python scripts/task.py setup

      - name: Lint
        run: python scripts/task.py lint

      - name: Test
        run: python scripts/task.py test

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Frontend unit tests
        run: pnpm --filter @ai-qa/web test

      - name: Check generated OpenAPI types
        run: |
          pnpm --filter @ai-qa/web api:types
          git diff --exit-code -- apps/web/src/api/generated-schema.d.ts

      - name: Typecheck
        run: pnpm --filter @ai-qa/web typecheck

      - name: Lint
        run: pnpm --filter @ai-qa/web lint

      - name: Build web application
        run: pnpm --filter @ai-qa/web build
