services:
  postgres:
    image: postgres:16-alpine
    container_name: aiqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_qa_platform}
      POSTGRES_USER: ${POSTGRES_USER:-aiqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiqa_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiqa} -d ${POSTGRES_DB:-ai_qa_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aiqa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiqa}:${POSTGRES_PASSWORD:-aiqa_secret_password}@postgres:5432/${POSTGRES_DB:-ai_qa_platform}
      # Route authorization: every non-probe route needs a bearer token.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-production}
      # AI provider: `fake` keeps the platform deterministic and offline.
      QA_AI_PROVIDER: ${QA_AI_PROVIDER:-fake}
      QA_AI_API_KEY: ${QA_AI_API_KEY:-}
      QA_AI_BASE_URL: ${QA_AI_BASE_URL:-https://api.openai.com/v1}
      QA_AI_MODEL: ${QA_AI_MODEL:-gpt-4o-mini}
      # Integrations (optional; each falls back to a dry-run adapter when unset).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      TESTRAIL_BASE_URL: ${TESTRAIL_BASE_URL:-}
      TESTRAIL_EMAIL: ${TESTRAIL_EMAIL:-}
      TESTRAIL_API_KEY: ${TESTRAIL_API_KEY:-}
      JENKINS_BASE_URL: ${JENKINS_BASE_URL:-}
      JENKINS_USER: ${JENKINS_USER:-}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - runtime_data:/app/runtime
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      AI_QA_API_URL: http://api:8000
      # Workers must authenticate; create an API key in the UI (Security → API Keys) and set it here.
      AI_QA_AUTH_TOKEN: ${AI_QA_AUTH_TOKEN:-}
      WORKER_NAME: Docker-Runner
      MAX_CONCURRENCY: 4
      WORKER_CAPABILITIES: playwright,chromium,firefox,pytest,python3
      WORKSPACE_STORAGE_DIR: /app/runtime/workspaces
      ARTIFACT_STORAGE_DIR: /app/runtime/artifacts
    volumes:
      - runtime_data:/app/runtime
    deploy:
      replicas: 2

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aiqa-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:
  runtime_data:
