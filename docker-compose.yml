services:
  postgres:
    image: postgres:16-alpine
    container_name: aiqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_qa_platform}
      POSTGRES_USER: ${POSTGRES_USER:-aiqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiqa_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiqa} -d ${POSTGRES_DB:-ai_qa_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: aiqa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-41-28Z
    container_name: aiqa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/ai-qa-artifacts;
      /usr/bin/mc anonymous set download local/ai-qa-artifacts;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aiqa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiqa}:${POSTGRES_PASSWORD:-aiqa_secret_password}@postgres:5432/${POSTGRES_DB:-ai_qa_platform}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: ai-qa-artifacts
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-ai-qa-platform-super-secret-key-change-in-production}
    ports:
      - "8000:8000"
    volumes:
      - runtime_data:/app/runtime
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      AI_QA_API_URL: http://api:8000
      WORKER_NAME: Docker-Runner
      MAX_CONCURRENCY: 4
      WORKER_CAPABILITIES: playwright,chromium,firefox,pytest,python3
    deploy:
      replicas: 2

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aiqa-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:
  minio_data:
  runtime_data:
