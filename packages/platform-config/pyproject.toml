[project]
name = "platform-config"
version = "0.1.0"
description = "Shared typed runtime configuration for the AI QA Platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
