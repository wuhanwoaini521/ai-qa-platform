[project]
name = "ai-qa-platform"
version = "0.1.0"
description = "Browser-based AI QA Engineering Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/qa-core",
    "packages/project-model",
    "packages/integrations",
]

[tool.uv.sources]
project-model = { workspace = true }
qa-core = { workspace = true }
integrations = { workspace = true }
api = { workspace = true }
worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/qa-core/tests", "packages/integrations/tests", "apps/worker/tests"]
# Imported QA projects and their runtimes live under runtime/: collecting them would execute
# third-party test code (and fail on their dependencies) instead of the platform's own suite.
norecursedirs = [".git", ".venv", "node_modules", "runtime", "dist", ".pytest_cache", ".ruff_cache"]
asyncio_mode = "auto"
pythonpath = ["apps/api", "packages/qa-core", "packages/project-model", "packages/integrations", "apps/worker"]
markers = [
    "unit: fast, isolated test with no external dependency",
    "integration: test spanning several layers (API, services, persistence)",
    "postgres: requires AI_QA_TEST_DATABASE_URL pointing at PostgreSQL",
    "security: authentication, authorisation, secret handling or sandboxing behaviour",
    "e2e: end-to-end test spanning the whole stack",
    "slow: test that takes a noticeable amount of time",
]
